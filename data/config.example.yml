public:
  favicon:
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em"
    font-size="90">🪲</text></svg>'
  logo:
    '<svg xmlns="http://www.w3.org/2000/svg" width="920" height="142" viewBox="0 0 920 142"
    version="1.1"></svg>'
  companyName: "Example Company"
  refreshInterval: 900
  basedomain: "http://localhost:3000"

salt: "replace-with-a-long-random-secret" # used to sign subscription links

dailyThresholds: # fractions of known checks; no-data checks and days are excluded
  down: 0.001
  degraded: 0.005

database:
  path: "data/database.sqlite" # will be created on first startup

smtp: # optional; omit this block to disable subscriptions and hide the button
  host: "smtp.example.com"
  from: "status@example.com"
  port: 25
  username: "smtp_user"
  password: "smtp_password"

groups: # list of groups shown on the status page
  - name: "Endpoints"
    monitors: # list of monitor ids
      - 1
  - name: "Infrastructure"
    monitors:
      - 2

monitors: # list of monitors
  - name: "Website"
    id: 1 # must be unique
    uuid: "not-required" # optional for http monitors
    description: null # optional
    visible: true # a monitor that is not visible will not be shown on the status page and does not create / resolve incidents
    type: "http" # http or api
    url: "https://example.com" # http endpoint to check
    regexp: ".*nginx.*" # regexp to check for in response body
    validStatusCodes: # optional, default: 200
      - 200
      - 404
    checkInterval: 60000 # in ms
    retries: 3 # number of retries before tracking monitor_check "down"
    timeoutDownMs: 5000 # in ms
    timeoutDegradedMs: 1000 # in ms
    incidents: # optional
      down: # optional
        createAfter: 2 # number of "down" checks before creating incident
        resolveAfter: 2 # number of "up" or "degraded" checks before resolving incident
      degraded: # optional
        createAfter: 5 # number of "degraded" checks before creating incident
        resolveAfter: 5 # consecutive "up" or "degraded" checks; active degradation takes precedence

  - name: "Backend"
    id: 2
    uuid: "example-push-token-change-me" # required for api monitors, unique and at least 16 characters
    # GET /api/monitor/<token>?status=up|down|degraded&value=123
    # the numeric value parameter is optional and will be stored in the database for each check, but currently not used
    description: null # optional
    visible: true # a monitor that is not visible will not be shown on the status page and does not create / resolve incidents
    type: "api" # http or api
    checkInterval: 120000 # an api monitor will increment its retries if last call to the endpoint was more than checkInterval ms ago
    retries: 2 # number of retries before tracking monitor_check "down"
    onMissing: down # down (default) or unknown when reports stop arriving
    uptimeWording: "availability" # optional, default: 'uptime'
    incidents:
      down:
        createAfter: 3
        resolveAfter: 2
      degraded:
        createAfter: 10
        resolveAfter: 5
