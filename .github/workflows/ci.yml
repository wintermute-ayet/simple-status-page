name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend-vite/package-lock.json
      - name: Install server dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend-vite
      - name: Lint server and frontend
        run: npm run lint
      - name: Typecheck server, tests, and frontend
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build server and frontend
        run: npm run buildall
      - name: Report production dependency vulnerabilities
        continue-on-error: true
        run: npm audit --omit=dev
      - name: Report frontend dependency vulnerabilities
        continue-on-error: true
        run: npm audit --omit=dev
        working-directory: frontend-vite
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: simple-status-page:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container and frontend bundle
        run: |
          docker run --detach --name status-page-ci \
            --publish 127.0.0.1:3000:3000 \
            --mount type=bind,source="$PWD/data/config.example.yml",target=/app/data/config.yaml,readonly \
            simple-status-page:ci
          trap 'docker logs status-page-ci; docker rm -f status-page-ci >/dev/null' EXIT
          healthy=false
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' status-page-ci)" = healthy ]; then
              healthy=true
              break
            fi
            sleep 2
          done
          test "$healthy" = true
          curl -fsS http://127.0.0.1:3000/healthz
          docker exec status-page-ci node -e '
            const fs = require("node:fs");
            const directory = "frontend-vite/dist/assets";
            const bundles = fs.readdirSync(directory).filter(name => name.endsWith(".js"));
            if (bundles.length === 0) process.exit(1);
            for (const name of bundles) {
              if (fs.readFileSync(directory + "/" + name, "utf8").includes("undefined/api")) process.exit(1);
            }
          '
