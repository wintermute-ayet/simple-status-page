name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend-vite/package-lock.json
      - name: Install server dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend-vite
      - name: Lint server and frontend
        run: npm run lint
      - name: Typecheck server, tests, and frontend
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build server and frontend
        run: npm run buildall
      - name: Report production dependency vulnerabilities
        continue-on-error: true
        run: npm audit --omit=dev
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          tags: simple-status-page:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
